{% extends "base.html" %}

{% block title %}Download App{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title mb-4">Download the App</h2>
                <p class="lead">Get the best experience with our mobile app!</p>
                
                <div class="mt-4">
                    <p>Redirecting you to the appropriate app store...</p>
                    <div class="spinner-border text-primary" role="status">
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
                
                <div class="mt-4">
                    <p>If you're not redirected automatically, click below:</p>
                    <div class="d-flex flex-column align-items-center gap-3">
                        <a href="https://apps.apple.com/app/id6760557044" class="app-store-badge">
                            <img src="{{ url_for('static', filename='images/Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.svg') }}" 
                                 alt="Download on the App Store" 
                                 style="height: 60px;">
                        </a>
                        <br>
                        <a href="https://play.google.com/store/apps/details?id=uk.co.hotelsinternational.loyalty.twa" class="app-store-badge">
                            <img src="{{ url_for('static', filename='images/GetItOnGooglePlay_Badge_Web_color_English.png') }}" 
                                 alt="Get it on Google Play" 
                                 style="height: 60px;">
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Detect device and redirect to appropriate app store
    const userAgent = navigator.userAgent;
    console.log('User Agent:', userAgent);
    
    // More comprehensive iOS detection
    const isIOS = /iPhone|iPad|iPod|Macintosh/i.test(userAgent) && /Mobile/i.test(userAgent);
    const isAndroid = /Android/i.test(userAgent);
    
    console.log('Is iOS:', isIOS);
    console.log('Is Android:', isAndroid);
    
    // Add a small delay before redirect
    setTimeout(() => {
        if (isIOS) {
            console.log('Redirecting to App Store...');
            window.location.href = "https://apps.apple.com/app/id6760557044";
        } else if (isAndroid) {
            console.log('Redirecting to Play Store...');
            window.location.href = "https://play.google.com/store/apps/details?id=uk.co.hotelsinternational.loyalty.twa";
        } else {
            // Desktop users - show both options or redirect to a landing page
            console.log('Desktop user detected');
            document.querySelector('.spinner-border').style.display = 'none';
            document.querySelector('p[class="lead"]').textContent = 'Choose your platform to download the app:';
        }
    }, 1000); // 1 second delay
</script>

<style>
.app-store-badge {
    text-decoration: none;
    transition: transform 0.2s ease;
}

.app-store-badge:hover {
    transform: scale(1.05);
}

.spinner-border {
    width: 3rem;
    height: 3rem;
}
</style>
{% endblock %}
